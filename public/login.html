<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="index.html">Home</a></li><li><a href="register.html" data-guest-only>Create account</a></li></ul>
        </nav>
    </header>
    <main class="page auth-layout">
        <section class="auth-intro"><h2>Welcome back.</h2><p>Sign in securely to manage your appointments and profile.</p></section>
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title">Patient login</h1>
            <form id="loginForm" class="form-grid">
                <div class="form-field full"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
                <div class="form-field full"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
                <div class="form-field full"><button type="submit">Sign in</button></div>
            </form>
            <p><a href="register.html">New patient? Create an account</a></p>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
