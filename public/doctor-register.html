<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Telemedicine</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="/"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="/doctor/login">Doctor sign in</a></li><li><a href="/login.html">Patient login</a></li></ul>
        </nav>
    </header>
    <main class="page auth-layout">
        <section class="auth-intro"><h2>Join the care team.</h2><p>Create a doctor account and manage your booked consultations.</p></section>
        <section class="auth-card" aria-labelledby="doctor-register-title">
            <h1 id="doctor-register-title">Doctor registration</h1>
            <form id="doctorRegisterForm" class="form-grid">
                <div class="form-field"><label for="first_name">First name</label><input id="first_name" name="first_name" required></div>
                <div class="form-field"><label for="last_name">Last name</label><input id="last_name" name="last_name" required></div>
                <div class="form-field full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
                <div class="form-field full"><label for="specialization">Specialization</label><input id="specialization" name="specialization" required></div>
                <div class="form-field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
                <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
                <div class="form-field full"><button type="submit">Create doctor account</button></div>
            </form>
        </section>
    </main>
    <footer class="footer">&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App</footer>
    <script src="/scripts/ui.js"></script>
    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/doctor-register.js"></script>
</body>
</html>
