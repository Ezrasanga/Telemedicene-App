<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Telemedicine</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="/"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="/doctor/register">Create doctor account</a></li><li><a href="/login.html">Patient login</a></li></ul>
        </nav>
    </header>
    <main class="page auth-layout">
        <section class="auth-intro"><h2>Welcome, doctor.</h2><p>Sign in to view and manage patient appointments.</p></section>
        <section class="auth-card" aria-labelledby="doctor-login-title">
            <h1 id="doctor-login-title">Doctor login</h1>
            <form id="doctorLoginForm" class="form-grid">
                <div class="form-field full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
                <div class="form-field full"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
                <div class="form-field full"><button type="submit">Sign in</button></div>
            </form>
        </section>
    </main>
    <footer class="footer">&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App</footer>
    <script src="/scripts/ui.js"></script>
    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/doctor-login.js"></script>
</body>
</html>
