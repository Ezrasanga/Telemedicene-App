<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="/appointments">My appointments</a></li><li><a href="profile.html">My profile</a></li><li><a href="/login.html" data-logout="/login.html">Sign out</a></li></ul>
        </nav>
    </header>
    <main class="page">
        <section class="card" style="max-width:700px;margin:auto">
            <h1>Book an appointment</h1>
            <form id="bookForm" class="form-grid">
                <div class="form-field full"><label for="doctor_id">Doctor</label><select id="doctor_id" name="doctor_id" required><option value="">Loading doctors...</option></select></div>
                <div class="form-field"><label for="appointment_date">Date</label><input type="date" id="appointment_date" name="appointment_date" required></div>
                <div class="form-field"><label for="appointment_time">Time</label><input type="time" id="appointment_time" name="appointment_time" required></div>
                <div class="form-field full"><button type="submit">Confirm appointment</button></div>
            </form>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/book.js"></script>
</body>
</html>
