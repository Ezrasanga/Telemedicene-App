<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="index.html">Home</a></li><li><a href="login.html" data-guest-only>Sign in</a></li></ul>
        </nav>
    </header>
    <main class="page auth-layout">
        <section class="auth-intro"><h2>Care starts here.</h2><p>Create a patient account to book and manage consultations.</p></section>
        <section class="auth-card" aria-labelledby="register-title">
            <h1 id="register-title">Create account</h1>
            <form id="registerForm" class="form-grid">
                <div class="form-field"><label for="first_name">First name</label><input type="text" id="first_name" name="first_name" autocomplete="given-name" required></div>
                <div class="form-field"><label for="last_name">Last name</label><input type="text" id="last_name" name="last_name" autocomplete="family-name" required></div>
                <div class="form-field full"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
                <div class="form-field full"><label for="password">Password</label><input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required></div>
                <div class="form-field full"><button type="submit">Create account</button></div>
            </form>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/register.js"></script>
</body>
</html>
