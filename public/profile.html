<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="/appointments">My appointments</a></li><li><a href="book.html">Book appointment</a></li><li><a href="/login.html" data-logout="/login.html">Sign out</a></li></ul>
        </nav>
    </header>
    <main class="page">
        <section class="card" style="max-width:700px;margin:auto">
            <h1>Personal profile</h1>
            <form id="profileForm" class="form-grid">
                <div class="form-field"><label for="first_name">First name</label><input type="text" id="first_name" name="first_name" required></div>
                <div class="form-field"><label for="last_name">Last name</label><input type="text" id="last_name" name="last_name" required></div>
                <div class="form-field full"><label for="email">Email</label><input type="email" id="email" name="email" required readonly></div>
                <div class="form-field full"><button type="submit">Save changes</button></div>
            </form>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/profile.js"></script>
</body>
</html>
