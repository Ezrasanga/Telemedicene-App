<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="index.html">Home</a></li><li><a href="login.html">Patient login</a></li><li><a href="/doctor/login">Doctor login</a></li></ul>
        </nav>
    </header>
    <main class="page auth-layout">
        <section class="auth-intro"><h2>Administration.</h2><p>Secure access for authorized clinical administrators.</p></section>
        <section class="auth-card" aria-labelledby="admin-login-title">
            <h1 id="admin-login-title">Admin login</h1>
            <form id="adminLoginForm" class="form-grid">
                <div class="form-field full"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required></div>
                <div class="form-field full"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
                <div class="form-field full"><button type="submit">Sign in</button></div>
            </form>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/admin-login.js"></script>
</body>
</html>
