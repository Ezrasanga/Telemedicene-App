<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - Telemedicine App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Telemedicine</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle><span class="nav-toggle-lines"></span></button>
            <ul class="nav-links" data-nav-links><li><a href="admin-dashb.html">Dashboard</a></li><li><a href="/admin-login.html" data-logout="/admin-login.html">Sign out</a></li></ul>
        </nav>
    </header>
    <main class="page">
        <section class="auth-card" aria-labelledby="admin-register-title">
            <h1 id="admin-register-title">Create administrator</h1>
            <form id="adminRegisterForm" class="form-grid">
                <div class="form-field full"><label for="username">Username</label><input type="text" id="username" name="username" minlength="3" required></div>
                <div class="form-field full"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
                <div class="form-field full"><label for="password">Temporary password</label><input type="password" id="password" name="password" minlength="8" required></div>
                <div class="form-field full"><button type="submit">Create administrator</button></div>
            </form>
        </section>
    </main>
    <!-- Add this before the <footer> tag in each HTML file -->
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Telemedicine App. All rights reserved.</p>
    </footer>
    <script src="scripts/ui.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/admin-register.js"></script>
</body>
</html>
